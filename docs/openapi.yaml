  /api/v1/dashboard/balance-threshold:
    get:
      operationId: api_v1_dashboard_balance_threshold_retrieve
      description: |-
        Parent can view and update their low-balance alert threshold.

        GET returns the effective threshold (explicit value or system default).
        PUT accepts balance_threshold (decimal) or null to reset to the default.
      tags:
      - alerts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceThreshold'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeMessage'
          description: ''
    put:
      operationId: api_v1_dashboard_balance_threshold_update
      description: |-
        Parent can view and update their low-balance alert threshold.

        GET returns the effective threshold (explicit value or system default).
        PUT accepts balance_threshold (decimal) or null to reset to the default.
      tags:
      - alerts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BalanceThresholdRequest'
          application/x-www-form-urlencoded:
            schema:

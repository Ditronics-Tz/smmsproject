openapi: 3.0.3
info:
  title: SMMS API
  version: 1.0.0
  description: Student Meal Management System API
paths:
  /api/v1/analytics/operators:
    get:
      operationId: api_v1_analytics_operators_retrieve
      description: Per-operator scan counts and NFC share for analytics consumers.
      tags:
      - analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorScanAnalytics'
          description: ''
  /api/v1/audit/logs:
    get:
      operationId: api_v1_audit_logs_list
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - activate
          - approve
          - create
          - deactivate
          - delete
          - login
          - replace
          - reverse
          - update
        description: |-
          * `create` - Create
          * `update` - Update
          * `deactivate` - Deactivate
          * `activate` - Activate
          * `delete` - Delete
          * `approve` - Approve
          * `reverse` - Reverse
          * `replace` - Replace
          * `login` - Login
      - in: query
        name: actor
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - audit
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/auth/activate-deactivate-user:
    post:
      operationId: api_v1_auth_activate_deactivate_user_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserActivateDeactivateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserActivateDeactivateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserActivateDeactivateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeMessage'
          description: ''
  /api/v1/auth/change-password:
    post:
      operationId: api_v1_auth_change_password_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequestRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeMessage'
          description: ''
  /api/v1/auth/create-user:
    post:
      operationId: api_v1_auth_create_user_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:

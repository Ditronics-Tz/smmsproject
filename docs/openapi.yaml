            application/json:
              schema:
                $ref: '#/components/schemas/CodeMessage'
          description: ''
  /sessions/transaction-list/:
    post:
      operationId: sessions_transaction_list_create
      tags:
      - sessions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionListRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TransactionListRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TransactionListRequestRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeMessage'
          description: ''
  /sms/logs:
    get:
      operationId: sms_logs_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: provider
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - failed
          - pending
          - sent
          - skipped_no_phone
          - skipped_opt_out
          - skipped_rate_limit
        description: |-
          * `pending` - Pending
          * `sent` - Sent
          * `failed` - Failed
          * `skipped_opt_out` - Skipped - Opt Out
          * `skipped_rate_limit` - Skipped - Rate Limited
          * `skipped_no_phone` - Skipped - No Phone
      tags:
      - sms
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSMSLogList'
          description: ''
  /sms/opt-out:
    post:
      operationId: sms_opt_out_create
      tags:
      - sms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SMSOptOutRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SMSOptOutRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SMSOptOutRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SMSOptOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeMessage'
          description: ''
  /status:
    get:
      operationId: status_retrieve
      description: Dependency checks - staff only. Do NOT use for LB probe.
      tags:
      - health
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: ''
  /wallet/deposit/create:
    post:
      operationId: wallet_deposit_create_create
      description: Parent submits a top-up deposit request for one of their children's
        cards.
      tags:
      - wallet
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDepositRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateDepositRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateDepositRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankDeposit'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeMessage'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeMessage'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeMessage'
          description: ''
  /wallet/deposit/list:
    get:
      operationId: wallet_deposit_list_list
      description: 'List deposits: parent sees own; admin/operator sees all.'
      parameters:
      - in: query
        name: from
        schema:
          type: string
          format: date
        description: Inclusive start date.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: payment_method
        schema:
          type: string
          enum:
          - cash
          - mobile_money
      - in: query
        name: provider
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - failed
          - pending
          - processed
      - in: query
        name: to
        schema:
          type: string
          format: date
        description: Inclusive end date.
      tags:
      - wallet
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBankDepositList'
          description: ''
  /wallet/deposit/process:
    post:
      operationId: wallet_deposit_process_create
      description: |-
        Admin/operator approves or fails a pending deposit.
        On approval: credits RFIDCard.balance atomically (select_for_update),
        writes LedgerEntry(event_type='deposit'), sets processed_at, notifies parent.
      tags:
      - wallet
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessDepositRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProcessDepositRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProcessDepositRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankDeposit'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeMessage'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeMessage'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeMessage'
          description: ''
  /wallet/ledger/card:
    get:
      operationId: wallet_ledger_card_list
      description: |-
        Admin/parent sees paginated LedgerEntry rows for a given card.
        Reconstructs the running balance entry-by-entry.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - wallet
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCardLedgerViewList'
          description: ''
  /wallet/transaction/reverse:
    post:
      operationId: wallet_transaction_reverse_create
      description: |-
        Admin/operator voids a transaction, restoring the exact amount to the card balance.
        Idempotent: cannot be applied twice (transaction.is_voided guard + unique Reversal row).
      tags:
      - wallet
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReversalRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReversalRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReversalRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeMessage'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeMessage'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeMessage'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeMessage'
          description: ''
components:
  schemas:
    ActivateDeactivateEnum:
      enum:
      - activate
      - deactivate
      type: string
      description: |-
        * `activate` - activate
        * `deactivate` - deactivate
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
        actor:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        actor_username:
          type: string
          readOnly: true
        action:
          allOf:
          - $ref: '#/components/schemas/AuditLogActionEnum'
          readOnly: true
        content_type:
          type: integer
          readOnly: true
          nullable: true
        content_type_name:
          type: string
          readOnly: true
        object_id:
          type: string
          readOnly: true
          nullable: true
        object_repr:
          type: string
          readOnly: true
        before:
          readOnly: true
          nullable: true
        after:
          readOnly: true
          nullable: true
        ip_address:
          type: string
          readOnly: true
          nullable: true
        path:
          type: string
          readOnly: true
        user_agent:
          type: string
          readOnly: true
      required:
      - action
      - actor
      - actor_username
      - after
      - before
      - content_type
      - content_type_name
      - id
      - ip_address
      - object_id
      - object_repr
      - path
      - timestamp
      - user_agent
    AuditLogActionEnum:
      enum:
      - create
      - update
      - deactivate
      - activate
      - delete
      - approve
      - reverse
      - replace
      - login
      type: string
      description: |-
        * `create` - Create
        * `update` - Update
        * `deactivate` - Deactivate
        * `activate` - Activate
        * `delete` - Delete
        * `approve` - Approve
        * `reverse` - Reverse
        * `replace` - Replace
        * `login` - Login
    BalanceThreshold:
      type: object
      description: Read/write a parent's low-balance threshold. A null value resets
        to default.
      properties:
        balance_threshold:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        effective_threshold:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - effective_threshold
    BalanceThresholdRequest:
      type: object
      description: Read/write a parent's low-balance threshold. A null value resets
        to default.
      properties:
        balance_threshold:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
    BankDeposit:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        control_number:
          type: string
          readOnly: true
        card_number:
          type: string
          readOnly: true
        student_name:
          type: string
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        status:
          $ref: '#/components/schemas/DepositStatusEnum'
        processed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        submitted_by:
          type: string
          format: uuid
          nullable: true
          description: Parent who requested the deposit (optional, for audit)
        submitted_by_name:
          type: string
          readOnly: true
          nullable: true
        payment_method:
          $ref: '#/components/schemas/BankDepositPaymentMethodEnum'
        provider:
          type: string
          nullable: true
          maxLength: 50
        reference:
          type: string
          nullable: true
          maxLength: 100
        phone_masked:
          type: string
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - card_number
      - control_number
      - created_at
      - id
      - phone_masked
      - processed_at
      - student_name
      - submitted_by_name
    BankDepositPaymentMethodEnum:
      enum:
      - cash
      - mobile_money
      type: string
      description: |-
        * `cash` - Cash
        * `mobile_money` - Mobile money
    BlankEnum:
      enum:
      - ''
    CanteenItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        is_active:
          type: boolean
          description: Soft-deactivate instead of deleting when transaction history
            exists
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - price
      - updated_at
    CanteenItemRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        is_active:
          type: boolean
          description: Soft-deactivate instead of deleting when transaction history
            exists
      required:
      - name
      - price
    CardActivateDeactivateRequest:
      type: object
      properties:
        card_id:
          type: string
          format: uuid
          nullable: true
        action:
          $ref: '#/components/schemas/ActivateDeactivateEnum'
    CardIdRequestRequest:
      type: object
      properties:
        card_id:
          type: string
          format: uuid
          nullable: true
    CardLedgerView:
      type: object
      description: Output for a single ledger entry with running balance reconstruction.
      properties:
        timestamp:
          type: string
          format: date-time
        event_type:
          type: string
        event_type_display:
          type: string
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        balance_before:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        balance_after:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        description:
          type: string
          readOnly: true
      required:
      - amount
      - balance_after
      - balance_before
      - description
      - event_type
      - event_type_display
      - timestamp
    CardStatementLine:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        entry_id:
          type: string
          format: uuid
          readOnly: true
        event_type:
          type: string
          readOnly: true
        memo:
          type: string
          readOnly: true
        account:
          type: string
          readOnly: true
        direction:
          $ref: '#/components/schemas/DirectionEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        balance_after:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - account
      - amount
      - created_at
      - direction
      - entry_id
      - event_type
      - id
      - memo
    ChangePasswordRequestRequest:
      type: object
      properties:
        old_password:
          type: string
        new_password:
          type: string
    ChildSpend:
      type: object
      properties:
        child_id:
          type: string
          format: uuid
        child_name:
          type: string
        class_room:
          type: string
          nullable: true
        total_spend:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        transaction_count:
          type: integer
        penalty_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemSpend'
      required:
      - child_id
      - child_name
      - penalty_amount
      - total_spend
      - transaction_count
    ChildSpendPeriod:
      type: object
      properties:
        period:
          type: string
        start_date:
          type: string
          format: date
        children:
          type: array
          items:
            $ref: '#/components/schemas/ChildSpend'
      required:
      - children
      - period
      - start_date
    ChildSpendRequestRequest:
      type: object
      properties:
        period:
          allOf:
          - $ref: '#/components/schemas/PeriodEnum'
          default: week
        start_date:
          type: string
          format: date
          nullable: true
        child_id:
          type: string
          format: uuid
          nullable: true
    CodeMessage:
      type: object
      description: |-
        The app-wide `{code, message}` envelope, used for both success and errors.

        `code` is optional because a handful of legacy endpoints return a bare
        `{"message": ...}` or `{"error": ...}` with no code. Those are documented
        with MessageSerializer / ErrorSerializer instead, so `code` being optional
        here only reflects the endpoints that use this envelope inconsistently.
      properties:
        code:
          type: integer
          description: HTTP status, repeated in the body
        message:
          type: string
      required:
      - message
    Counts:
      type: object
      properties:
        total_students:
          type: integer
        total_parents:
          type: integer
        total_staffs:
          type: integer
        total_available_balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        total_transactions:
          type: integer
        sessions:
          type: integer
        price_week:
          type: integer
        price_today:
          type: integer
      required:
      - price_today
      - price_week
      - sessions
      - total_available_balance
      - total_parents
      - total_staffs
      - total_students
      - total_transactions
    CreateDepositPaymentMethodEnum:
      enum:
      - cash
      - mobile_money
      type: string
      description: |-
        * `cash` - cash
        * `mobile_money` - mobile_money
    CreateDepositRequest:
      type: object
      properties:
        card_number:
          type: string
          minLength: 1
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        payment_method:
          allOf:
          - $ref: '#/components/schemas/CreateDepositPaymentMethodEnum'
          default: cash
        provider:
          type: string
          nullable: true
        reference:
          type: string
          nullable: true
      required:
      - amount
      - card_number
    CreateRFIDCard:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        student_or_staff:
          type: string
          format: uuid
          description: Owner of the card. A student/staff may have multiple cards
        is_active:
          type: boolean
        control_number:
          type: string
          readOnly: true
        card_number:
          type: string
        issued_date:
          type: string
          format: date-time
          nullable: true
      required:
      - control_number
      - id
      - student_or_staff
    CreateRFIDCardRequest:
      type: object
      properties:
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        student_or_staff:
          type: string
          format: uuid
          description: Owner of the card. A student/staff may have multiple cards
        is_active:
          type: boolean
        card_number:
          type: string
        card_uid:
          type: string
          writeOnly: true
        issued_date:
          type: string
          format: date-time
          nullable: true
      required:
      - student_or_staff
    CreateUserResponse:
      type: object
      properties:
        message:
          type: string
        user:
          $ref: '#/components/schemas/UserCreate'
        invite_link:
          type: string
          format: uri
      required:
      - message
      - user
    DailyMenu:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        date:
          type: string
          format: date
        meal_type:
          $ref: '#/components/schemas/SessionTypeEnum'
        items:
          type: array
          items:
            $ref: '#/components/schemas/DailyMenuItem'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - date
      - id
      - items
      - meal_type
    DailyMenuItem:
      type: object
      properties:
        item_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        price:
          type: number
          format: double
          readOnly: true
        price_override:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
      required:
      - item_id
      - name
      - price
    DailyMenuItemInputRequest:
      type: object
      properties:
        item_id:
          type: string
          format: uuid
        price_override:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
      required:
      - item_id
    DailyMenuWriteRequest:
      type: object
      properties:
        date:
          type: string
          format: date
        meal_type:
          $ref: '#/components/schemas/SessionTypeEnum'
        items:
          type: array
          items:
            $ref: '#/components/schemas/DailyMenuItemInputRequest'
      required:
      - date
      - items
      - meal_type
    DependencyCheck:
      type: object
      properties:
        status:
          type: string
        latency_ms:
          type: number
          format: double
        error:
          type: string
        reason:
          type: string
      required:
      - status
    DepositActionEnum:
      enum:
      - process
      - fail
      type: string
      description: |-
        * `process` - Process
        * `fail` - Fail
    DepositStatusEnum:
      enum:
      - pending
      - processed
      - failed
      type: string
      description: |-
        * `pending` - Pending
        * `processed` - Processed
        * `failed` - Failed
    DirectionEnum:
      enum:
      - debit
      - credit
      type: string
      description: |-
        * `debit` - Debit
        * `credit` - Credit
    EndSessionRequestRequest:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
          nullable: true
        expected_cash:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          default: '0.00'
        reason:
          type: string
    EndSessionResponse:
      type: object
      properties:
        scanned_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        penalty_value:

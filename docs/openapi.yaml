          content:
            application/json:
              schema:
                type: string
                format: binary
          description: CSV or XLSX attachment
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportAccepted'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeMessage'
          description: ''
  /api/v1/exports/download/{token}:

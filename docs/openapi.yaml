  /api/v1/imports/commit:
    post:
      operationId: api_v1_imports_commit_create
      description: |-
        Commit a validated batch of student imports.

        Body: mode ('best_effort' | 'all_or_nothing'). Re-validates the file before
        committing so the commit is safe to call independently of /imports/upload.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImportUploadRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportUploadRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportUpload'
          description: ''
  /api/v1/imports/template:
    get:
      operationId: api_v1_imports_template_retrieve
      description: Download a CSV template (header + one sample row) for bulk onboarding.
      tags:
      - imports
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: CSV template
  /api/v1/imports/upload:
    post:
      operationId: api_v1_imports_upload_create
      description: |-
        Upload a CSV/XLSX file and validate every row.

        Defaults to dry_run=True, so no mutation happens. Returns a row-level
        validation report (valid/warning/error with precise messages). Pass
        ?dry_run=false to validate only (still no commit — use /imports/commit to
        actually import).
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImportUploadRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportUploadRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportUpload'
          description: ''
  /api/v1/ledger/accounts/{code}/statement:
    get:
      operationId: api_v1_ledger_accounts_statement_list
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - ledger
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:

          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserCreateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreate'
          description: ''
  /api/v1/auth/forgot-password:
    post:
      operationId: api_v1_auth_forgot_password_create
      description: |-
        Request a self-service password reset.

        Generates a single-use, expiring token, hashes it for storage, and emails
        the user a reset link. Always returns the same generic success response
        whether or not the email exists (enumeration-resistant, paired with the
        existing 'forget_password' throttle). Never generates or emails a plaintext
        password.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetRequest'
          description: ''
  /api/v1/auth/login:

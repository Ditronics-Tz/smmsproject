        last_name:
          type: string
          maxLength: 150
        username:
          type: string
          writeOnly: true
          minLength: 1
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        mobile_number:
          type: string
          nullable: true
          maxLength: 15
        role:
          $ref: '#/components/schemas/RoleEnum'
        school:

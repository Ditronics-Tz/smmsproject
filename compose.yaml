# ============================================================================
# Podman Compose for SMMS Backend (Django + PostgreSQL + Redis + Celery)
# API -> http://localhost:8000 (container :8000)
# Usage (from Fedora WSL, in this directory):
#   podman compose build
#   podman compose up -d
#   podman compose ps
#   podman compose logs -f
#   podman compose down
# Requires: podman >= 4, podman-compose or podman compose plugin, .env file
# (copy .env.example -> .env and set SECRET_KEY + DB_PASSWORD at minimum).
# Migrations run automatically via entrypoint.sh on `web` startup; workers
# wait for web setup. Never run destructive DB commands automatically.
# Manual migration: podman compose exec web python manage.py migrate --noinput
# Production overlay: podman compose -f compose.yaml -f compose.prod.yaml up -d
#   (see docker-compose.prod.yml for the gunicorn override reference).
# ============================================================================

services:
  db:
    image: postgres:15-alpine
    container_name: smms_db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME:-smmsdb}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      # Host 5439 avoids clashing with a host-native PostgreSQL on 5432
      - "127.0.0.1:5439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smmsapi_network

  redis:
    image: redis:7-alpine
    container_name: smms_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      # Host 6381 avoids host-native Redis (6379); 6380 was unusable in this
      # WSL2 instance (stale wslrelay mirror holds it). Container stays 6379.
      - "127.0.0.1:6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smmsapi_network

  web:
    build:
      context: .
      dockerfile: Containerfile
      target: runtime
    image: smms-api:dev
    container_name: smms_web
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - static_assets:/app/static
      - media_files:/app/uploads
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE=postgres
      - DB_NAME=${DB_NAME:-smmsdb}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=smmsproject.settings
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - SETUP_WAIT_TIMEOUT=12
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-}
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-False}
      - SECURE_HSTS_SECONDS=${SECURE_HSTS_SECONDS:-}
      - API_BASE_URL=${API_BASE_URL:-http://127.0.0.1:8000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smmsapi_network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  celery:
    build:
      context: .
      dockerfile: Containerfile
      target: runtime
    image: smms-api:dev
    container_name: smms_celery
    restart: unless-stopped
    command: celery -A smmsproject worker --loglevel=info
    volumes:
      - media_files:/app/uploads
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE=postgres
      - DB_NAME=${DB_NAME:-smmsdb}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=smmsproject.settings
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - SETUP_WAIT_TIMEOUT=12
    depends_on:
      - db
      - redis
      - web
    networks:
      - smmsapi_network

  celery-beat:
    build:
      context: .
      dockerfile: Containerfile
      target: runtime
    image: smms-api:dev
    container_name: smms_celery_beat
    restart: unless-stopped
    command: celery -A smmsproject beat --loglevel=info
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE=postgres
      - DB_NAME=${DB_NAME:-smmsdb}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=smmsproject.settings
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - SETUP_WAIT_TIMEOUT=12
    depends_on:
      - db
      - redis
      - web
    networks:
      - smmsapi_network

networks:
  smmsapi_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  static_assets:
  media_files:

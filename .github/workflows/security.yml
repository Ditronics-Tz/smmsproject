name: Security checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit pinned Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -r requirements.txt
          pip-audit -r requirements.txt --no-deps
      - name: Check production security settings
        env:
          SECRET_KEY: ci-deployment-check-key-not-for-production
          DB_PASSWORD: ci-deployment-check-password
          DEBUG: "False"
          ALLOWED_HOSTS: localhost
          SECURE_SSL_REDIRECT: "True"
          SECURE_HSTS_SECONDS: "31536000"
          SESSION_COOKIE_SECURE: "True"
          CSRF_COOKIE_SECURE: "True"
        run: python manage.py check --deploy

  tests:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-key-not-for-production
      DB_PASSWORD: ci-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 libffi-dev shared-mime-info
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python manage.py test --settings=smmsproject.test_settings

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git --redact --verbose --no-banner /repo

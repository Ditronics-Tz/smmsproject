<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set your SMMS password</title>
  <style>
    body { font: 16px system-ui, sans-serif; margin: 3rem auto; max-width: 28rem; padding: 0 1rem; }
    label, input, button { display: block; width: 100%; }
    input, button { box-sizing: border-box; margin-top: .5rem; padding: .75rem; }
    label { margin-top: 1rem; }
    #message { min-height: 1.5rem; }
  </style>
</head>
<body>
  <h1>Set your SMMS password</h1>
  <form id="password-form">
    <label for="new-password">New password</label>
    <input id="new-password" name="new_password" type="password" minlength="8" autocomplete="new-password" required>
    <label for="confirm-password">Confirm password</label>
    <input id="confirm-password" type="password" minlength="8" autocomplete="new-password" required>
    <button type="submit">Set password</button>
  </form>
  <p id="message" role="status" aria-live="polite"></p>
  <script>
    const token = new URLSearchParams(window.location.hash.slice(1)).get('token');
    const form = document.getElementById('password-form');
    const message = document.getElementById('message');

    if (!token) {
      form.hidden = true;
      message.textContent = 'This invite link is missing its token. Ask your administrator to resend it.';
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.getElementById('new-password').value;
      if (password !== document.getElementById('confirm-password').value) {
        message.textContent = 'The passwords do not match.';
        return;
      }
      const button = form.querySelector('button');
      button.disabled = true;
      try {
        const response = await fetch('/auth/reset-password/confirm', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, new_password: password }),
        });
        const result = await response.json();
        message.textContent = response.ok
          ? 'Your password is set. You can now sign in.'
          : (result.message || 'This invite link is invalid or has expired.');
        if (response.ok) {
          form.hidden = true;
          history.replaceState(null, '', window.location.pathname);
        } else {
          button.disabled = false;
        }
      } catch (_) {
        message.textContent = 'Unable to reach the server. Please try again.';
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
